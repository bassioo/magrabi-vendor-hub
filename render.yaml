# One-click showcase deploy on Render (free plan, demo mode, no disk: data resets when the service restarts).
# For go-live use render-live.yaml instead (paid plan with a persistent disk, live mode).
services:
  - type: web
    name: magrabi-vendor-hub
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: demo
      - key: PUBLIC_URL
        value: auto
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@magrabi.example
      - key: LOG_LEVEL
        value: warn
