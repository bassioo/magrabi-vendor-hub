name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: End-to-end (needs the sample documents folder)
        run: |
          npx playwright install chromium --with-deps
          SAMPLES_DIR="$GITHUB_WORKSPACE/data/sample-documents" npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: docs/screenshots, if-no-files-found: ignore }
